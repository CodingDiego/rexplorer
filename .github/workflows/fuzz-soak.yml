# Long checks that do not fit a pull request: fuzzing the parsers (#57) and the one-hour soak (#29), the same run as
# the one before every release (CONTRIBUTING.md). Weekly and by hand only, never on pull requests.
name: Fuzz and soak

on:
  schedule:
    - cron: "0 3 * * 0" # weekly, Sunday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    if: github.repository == 'CodingDiego/rexplorer'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      # Three minutes per target, every target fuzz/Cargo.toml lists; a crash in one does not stop the others.
      # --sanitizer none: the targets are safe Rust, so the finds are panics (debug assertions are on), and an
      # ASan build on MSVC would also need the ASan runtime DLL on PATH. Without ASan nothing defines the coverage
      # section delimiters on MSVC (LNK2001 __start___sancov_cntrs, run 43431291987); fuzz/src/lib.rs does.
      # A run that ends without libFuzzer's "Done N runs" line (a build or link error) counts as failed.
      - name: Fuzz every target
        run: |
          $failed = @()
          $targets = @(cargo +nightly fuzz list --fuzz-dir fuzz)
          if (-not $targets) { throw "cargo fuzz list printed no target: nothing was fuzzed" }
          foreach ($t in $targets) {
            New-Item -ItemType Directory -Force fuzz/work/$t | Out-Null
            cargo +nightly fuzz run $t fuzz/work/$t fuzz/corpus/$t --fuzz-dir fuzz --sanitizer none -- -max_total_time=180 -max_len=65536 2>&1 | Tee-Object -Variable log
            $code = $LASTEXITCODE
            $done = $log | Select-String -Pattern '^Done \d+ runs' | Select-Object -Last 1
            "$t exit=$code new_corpus=$((Get-ChildItem fuzz/work/$t -File).Count) $done" | Tee-Object -Append fuzz-summary.txt
            if ($code -or -not $done) { $failed += $t }
          }
          if ($failed) { throw "fuzz targets failed: $($failed -join ', '); inputs in the fuzz-artifacts upload" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: fuzz-artifacts
          path: |
            fuzz/artifacts/
            fuzz-summary.txt
          if-no-files-found: ignore
          retention-days: 7

  soak:
    if: github.repository == 'CodingDiego/rexplorer'
    runs-on: windows-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The release toolchain (release.yml), so the soaked exe is built like the one that ships.
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - run: cargo build --release --locked
      # Prints the operation counts and each resource's baseline, end and limit; fails under 300 rounds.
      - name: Soak, 60 minutes
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\soak.ps1 -Minutes 60 -Csv soak.csv
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: soak-samples
          path: soak.csv
          if-no-files-found: ignore
