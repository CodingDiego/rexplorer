# Long checks that do not fit a pull request: fuzzing the parsers (#57) and a 30-minute soak (#29), a signal between
# the 8-hour soak runs done before a release. Weekly and by hand only, never on pull requests.
name: Fuzz and soak

on:
  schedule:
    - cron: "0 3 * * 0" # weekly, Sunday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    if: github.repository == 'CodingDiego/rexplorer'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      # Three minutes per target, every target fuzz/Cargo.toml lists; a crash in one does not stop the others.
      # --sanitizer none: the targets are safe Rust, so the finds are panics (debug assertions are on), and an
      # ASan build on MSVC would also need the ASan runtime DLL on PATH.
      - name: Fuzz every target
        run: |
          $failed = @()
          foreach ($t in (cargo +nightly fuzz list --fuzz-dir fuzz)) {
            New-Item -ItemType Directory -Force fuzz/work/$t | Out-Null
            cargo +nightly fuzz run $t fuzz/work/$t fuzz/corpus/$t --fuzz-dir fuzz --sanitizer none -- -max_total_time=180 -max_len=65536
            if ($LASTEXITCODE) { $failed += $t }
          }
          if ($failed) { throw "fuzz targets failed: $($failed -join ', '); inputs in the fuzz-artifacts upload" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 7

  soak:
    if: github.repository == 'CodingDiego/rexplorer'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # The release toolchain (release.yml), so the soaked exe is built like the one that ships.
      - uses: dtolnay/rust-toolchain@1.99.1
      - run: cargo build --release --locked
      - name: Soak, 30 minutes
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\soak.ps1 -Minutes 30 -Csv soak.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-samples
          path: soak.csv
          if-no-files-found: ignore
