name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, so new advisories against the lockfile show up

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    # About three times a normal run (7-8 min): a shell dialog no test answers must not hold the runner for hours.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
        env:
          RUSTFLAGS: -D warnings
      - run: cargo test --release --locked
      # The smoke test's message-driven checks on the exe just built. -Hosted skips the ones that need a desktop
      # someone could be using (real input, the foreground, the Explorer shell, machine-specific timings: the
      # $DesktopOnly list in the script); run those locally with no switch. Windows PowerShell 5.1, as the script needs.
      - name: Smoke test (hosted subset)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\smoke.ps1 -Hosted
      # Performance budgets (#48) on the same exe. A regression tripwire, not a performance claim: about 10x the
      # medians in scripts\bench-results.md (start ~190 ms, 100,000-file list ~183 ms, idle 0.0 %), because a shared
      # runner is slower and noisier than the machine the script's defaults were set on. Churn keeps the issue's
      # 1 reload/s (the app's own one-second gate; 0.5-0.6 measured); the slowest UI-thread message gets 1000 ms
      # (43-46 ms measured on 2026-11-13 on a quiet laptop, 69-11,542 ms on a busy one, a 100,000-file load's
      # WM_ENUM_DONE; the issue's 100 ms is the script's default).
      - name: Performance budgets (hosted values)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\budgets.ps1 -StartMs 2000 -ListMs 2000 -IdlePct 3 -ChurnPerSec 1 -UiMs 1000

  # Builds with exactly the rust-version in Cargo.toml (read here, not repeated), so code or a dependency that needs a
  # newer Rust fails CI (#56).
  msrv:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the minimum supported Rust
        run: |
          $m = Select-String -Path Cargo.toml -Pattern '^rust-version = "([^"]+)"'
          if (-not $m) { throw 'no rust-version in Cargo.toml' }
          $v = $m.Matches[0].Groups[1].Value
          rustup toolchain install $v --profile minimal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup default $v
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --all-targets

  clippy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # The release toolchain (release.yml), so a new Rust release cannot add lints and turn CI red on its own.
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
          targets: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets -- -D warnings
      # Releases also ship an arm64 exe (cross-compiled); this catches arm64-only errors before a tag.
      - run: cargo clippy --locked --target aarch64-pc-windows-msvc -- -D warnings

  notices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: THIRD-PARTY-NOTICES.md lists exactly the crates in the exe
        run: |
          diff <(cargo tree --color never --locked -e normal,no-proc-macro --prefix none --format '{p}' \
                   --target x86_64-pc-windows-msvc --target aarch64-pc-windows-msvc |
                 sed 's/ (\*)$//' | grep -v -e ' (' -e '^$' | sed 's/ v/ /' | sort -u) \
               <(sed -nE 's/^\| `([^`]+)` \| ([^ |]+) \|.*/\1 \2/p' THIRD-PARTY-NOTICES.md | sort -u)

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
