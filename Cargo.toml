[workspace]
resolver = "2"
members = ["crates/core", "crates/app"]

[workspace.package]
# 1.88: let-chains and slice::as_chunks, both used in the sources (edition 2024 alone needs 1.85).
rust-version = "1.88"

[workspace.dependencies]
# Pinned on purpose: the windows crate breaks its API across minors. Upgrade deliberately.
windows = "=0.62.2"
# Same version as windows: the #[implement] macro needs windows-core as a direct dependency.
windows-core = "=0.62.2"

# unrar-ng 0.7.7 with one out-of-bounds read fixed; vendor/unrar-ng/VENDORED.md says what, why and when to drop it.
[patch.crates-io]
unrar-ng = { path = "vendor/unrar-ng" }

[profile.release]
lto = true
codegen-units = 1
