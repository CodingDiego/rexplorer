ShortDescription: A fast Windows file manager that can replace Windows Explorer.
Description: |-
  A Windows file manager written in Rust. It shows the Windows shell namespace with plain Win32 controls and hands
  everything it does not handle itself to the shell. Installing it makes it the default file manager for the current
  user; no administrator rights are needed. Undo with rexplorer.exe --uninstall.
