# Draft for microsoft/winget-pkgs, not submitted yet. Before submitting, replace both InstallerSha256 values with
# the zip hashes from the release's SHA256SUMS.txt.
# The exe installs itself as a normal per-user program (rexplorer.exe --install --quiet): it copies itself to
# %LOCALAPPDATA%\Programs\rexplorer, adds a Start menu shortcut and the Apps and Features entry HKCU\...\Uninstall\rexplorer
# (ProductCode below), whose UninstallString is "<dir>\rexplorer.exe" --uninstall --quiet. It changes no folder or
# Explorer key; making it the default file manager is a separate step (rexplorer --register).
# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.10.0.schema.json

PackageIdentifier: CodingDiego.rexplorer
PackageVersion: 0.2.0
MinimumOSVersion: 10.0.19045.0
InstallerType: zip
NestedInstallerType: exe
Scope: user
InstallModes:
  - silent
InstallerSwitches:
  Silent: --install --quiet
  SilentWithProgress: --install --quiet
UpgradeBehavior: install
ProductCode: rexplorer
InstallationMetadata:
  DefaultInstallLocation: '%LOCALAPPDATA%\Programs\rexplorer'
AppsAndFeaturesEntries:
  - DisplayName: rexplorer
    Publisher: CodingDiego
    ProductCode: rexplorer
Installers:
  - Architecture: x64
    NestedInstallerFiles:
      - RelativeFilePath: rexplorer-0.2.0-x64\rexplorer.exe
    InstallerUrl: https://github.com/CodingDiego/rexplorer/releases/download/v0.2.0/rexplorer-0.2.0-x64.zip
    InstallerSha256: <SHA256 of rexplorer-0.2.0-x64.zip>
  - Architecture: arm64
    NestedInstallerFiles:
      - RelativeFilePath: rexplorer-0.2.0-arm64\rexplorer.exe
    InstallerUrl: https://github.com/CodingDiego/rexplorer/releases/download/v0.2.0/rexplorer-0.2.0-arm64.zip
    InstallerSha256: <SHA256 of rexplorer-0.2.0-arm64.zip>
ManifestType: installer
ManifestVersion: 1.10.0
