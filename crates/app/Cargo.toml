[package]
name = "rexplorer"
version = "0.1.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/CodingDiego/rexplorer"

[dependencies]
rexplorer-core = { path = "../core" }
# The windows crate's own WinRT collections (already in the lock through it): IIterable for the share sheet.
windows-collections = "0.3.2"
windows = { workspace = true, features = [
    "ApplicationModel_DataTransfer",
    "Foundation_Collections",
    "Storage",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
