dlg.register.start=Open folders and Win+E with rexplorer?\n\nThis writes {keys} = "{exe}" (per-user only; nothing under HKLM changes).\n\nUndo with rexplorer --unregister. To copy rexplorer to a fixed place first, use More > Install as default file manager.
