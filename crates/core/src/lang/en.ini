dlg.install.confirm=Install rexplorer as your file manager?\n\nThis replaces Windows Explorer for folders, drives, Win+E and the taskbar's File Explorer. If rexplorer is already installed and running, the running copy is replaced: its open windows keep working until you close them, and anything opened after this uses the new copy.\n\n{plan}
